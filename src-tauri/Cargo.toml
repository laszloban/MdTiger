[package]
name = "mdtiger"
version = "0.1.0"
description = "MdTiger: a fast Markdown viewer and editor"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri/wry use, to reach the WebView2 ProcessFailed event.
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
